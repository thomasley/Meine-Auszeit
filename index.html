function render(){const titles={main:'♫ Hauptmenü',relax:'Entspannung',sleep:'Einschlafhilfe',mood:'Stimmung',place:'Wohlfühlort',duration:'Dauer',listen:'♫ Wiedergabe',history:'Dein Verlauf',feedback:'Wie war deine Auszeit?'};$('title').textContent=titles[page]||'Meine Auszeit';items=menuItems();selected=Math.max(0,Math.min(selected,items.length-1));let prefix='';if(page==='listen'){prefix=session?`<div class="now"><div class="art" aria-hidden="true">🌊</div><h2>Norddeich</h2><div class="sub">Original-Hörprobe · Entspannung</div><input class="progress" id="seek" type="range" min="0" max="${Number.isFinite(audio.duration)?audio.duration:1}" step="0.1" value="${audio.currentTime||0}" aria-label="Wiedergabeposition"><div class="times"><span id="elapsed">${fmt(audio.currentTime)}</span><span id="total">${fmt(audio.duration)}</span></div><div class="status" id="status" aria-live="polite"></div></div>`:`<p class="note">Deine Auswahl: <b>${esc(settings.mode)}</b><br>${esc(settings.place)} · ${settings.minutes} Minuten<br>${esc(settings.mood)}</p><p class="tiny">Die vollständige Aufnahme für diese Auswahl fehlt noch. Verfügbar ist die kurze Norddeich-Hörprobe. Sie wird separat abgespielt.</p>`}if(page==='history'){prefix=history.length?history.map(x=>`<div class="history"><b>${esc(x.place||'Norddeich')} · Hörprobe</b><br><small>${esc(new Date(x.date).toLocaleString('de-DE'))} · ${fmt(Number(x.seconds))} gehört<br>${x.completed?'Bis zum Ende gehört':'Vorzeitig beendet'} · ${esc(x.rating||'Ohne Bewertung')}</small></div>`).join(''):'<p class="note">Noch keine Auszeiten gespeichert.<br>Hier erscheinen beendete Hörproben mit Datum und Bewertung.</p>'}if(page==='feedback')prefix='<p class="note">Die Hörprobe wurde im Verlauf gespeichert.</p>';if(page==='relax'||page==='sleep')prefix='<p class="note">Ort, Stimmung und Dauer kannst du im Hauptmenü auswählen. Längere Aufnahmen sind noch in Vorbereitung.</p>';view.innerHTML=prefix+items.map((it,i)=>`<button class="item ${i===selecte function startPreview(){if(session){toggle();return}session={date:new Date().toISOString(),place:'Norddeich',mode:'Entspannung',kind:'Hörprobe',seconds:0,completed:false,rating:'Ohne Bewertung'};audio.currentTime=0;notice='';page='listen';selected=0;render();playAudio()}
